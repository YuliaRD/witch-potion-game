<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#10081d">
<title>The Witch's Potion</title>
<meta name="description" content="A bilingual Halloween speaking game in English and Spanish">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Montserrat:wght@500;600;700&display=swap');
:root{--violet:#a96cff;--acid:#8cff58;--gold:#ffc95b;--ink:#f9f2ff;--dark:#10081d;--panel:rgba(25,12,43,.86)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10081d;color:var(--ink);font-family:Montserrat,Arial,sans-serif;user-select:none}
button{font:inherit;color:inherit}
.game{position:fixed;inset:0;overflow:hidden;background:radial-gradient(circle at 50% 64%,#412367 0 12%,#1e1036 36%,#0d0717 78%)}
.game:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.55),transparent 24% 76%,rgba(0,0,0,.55)),radial-gradient(circle at 50% 8%,rgba(177,111,255,.13),transparent 31%);pointer-events:none}
.window{position:absolute;left:50%;top:12%;translate:-50% 0;width:min(30vw,330px);height:min(31vh,290px);border:12px solid #241331;border-radius:50% 50% 8px 8px;overflow:hidden;box-shadow:0 0 0 3px #5d376f,0 0 45px rgba(160,96,255,.22)}
.window:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 68% 28%,#fffbd6 0 4%,#d7c3ff 5% 11%,transparent 12%),linear-gradient(#332956,#725488 62%,#1a122b);box-shadow:inset 0 0 45px #0d0717}
.window:after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:47%;background:linear-gradient(145deg,transparent 0 18%,#10091b 19% 47%,transparent 48%),linear-gradient(35deg,transparent 0 24%,#170c25 25% 55%,transparent 56%),linear-gradient(165deg,transparent 0 42%,#0e0817 43%);opacity:.95}
.shelf{position:absolute;top:17%;width:27%;height:49%;border-bottom:18px solid #5b3041;background:linear-gradient(90deg,rgba(30,13,32,.88),rgba(66,32,55,.72),rgba(26,11,29,.9));box-shadow:inset 0 0 0 3px #2a1428,inset 0 -10px 20px rgba(0,0,0,.42);filter:drop-shadow(0 14px 8px #06030a)}
.shelf.left{left:0}.shelf.right{right:0;transform:scaleX(-1)}
.shelf:before{content:"";position:absolute;left:0;right:0;bottom:-25px;height:12px;background:linear-gradient(#8b5362,#402030);border-radius:0 0 5px 5px;box-shadow:0 8px 12px #050207}
.shelf:after{content:"";position:absolute;inset:10px 8px 3px;border:2px solid rgba(148,91,124,.22);border-bottom:0}
.bottle{position:absolute;bottom:16px;width:36px;height:74px;border:3px solid rgba(255,255,255,.4);border-radius:8px 8px 16px 16px;background:linear-gradient(90deg,rgba(255,255,255,.15),transparent 45%),var(--c);box-shadow:0 0 18px color-mix(in srgb,var(--c) 60%,transparent)}
.bottle:before{content:"";position:absolute;left:9px;top:-21px;width:13px;height:22px;border:3px solid rgba(255,255,255,.35);background:var(--c)}
.b1{left:8%;--c:#a13ef1}.b2{left:35%;height:58px;--c:#4bd789}.b3{left:63%;width:50px;--c:#f06b36}.b4{left:82%;height:88px;--c:#e4cf44}
.header{position:absolute;z-index:20;left:50%;top:2.2%;translate:-50% 0;width:min(94%,930px);display:flex;align-items:center;justify-content:space-between;gap:12px}
.title{font-family:Cinzel,serif;text-transform:uppercase;letter-spacing:.11em;text-shadow:0 3px 0 #3b1f54,0 0 24px #a96cff;font-size:clamp(18px,3.2vw,38px);white-space:nowrap}
.controls{display:flex;align-items:center;gap:8px}
.lang,.sound,.restart{border:1px solid rgba(255,255,255,.24);background:rgba(17,8,29,.72);box-shadow:inset 0 1px rgba(255,255,255,.12),0 8px 24px rgba(0,0,0,.3);border-radius:999px;padding:5px;display:flex;backdrop-filter:blur(12px)}
.lang button{border:0;background:transparent;padding:8px 11px;border-radius:999px;font-weight:800;font-size:12px;cursor:pointer}
.lang button.active{background:linear-gradient(135deg,#8d4ee8,#bf78ff);box-shadow:0 0 16px rgba(185,113,255,.55)}
.sound,.restart{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;padding:0;cursor:pointer;font-size:20px}
.progress{position:absolute;z-index:12;left:50%;top:10%;translate:-50% 0;display:flex;gap:9px}
.gem{width:18px;height:23px;clip-path:polygon(50% 0,100% 35%,82% 100%,18% 100%,0 35%);background:#2c1a3a;border:1px solid #694a7d;box-shadow:inset 0 0 8px #07030a;transition:.35s}
.gem.on{background:linear-gradient(135deg,#eaffba,#67ed3e 45%,#189c3a);filter:drop-shadow(0 0 8px #7cff4c);transform:translateY(-3px)}
.stage{position:absolute;inset:0;z-index:5}
.cauldron-wrap{position:absolute;left:50%;bottom:2.5%;translate:-50% 0;width:min(48vw,460px);height:min(48vh,440px);display:flex;align-items:flex-end;justify-content:center}
.glow{position:absolute;left:50%;bottom:0;translate:-50% 0;width:90%;height:48%;border-radius:50%;background:radial-gradient(ellipse,#6efa3d99 0,#6cf23430 37%,transparent 70%);filter:blur(12px);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.65;transform:scale(.92)}}
.cauldron{position:relative;width:78%;height:48%;border-radius:12% 12% 47% 47%;background:radial-gradient(circle at 48% 22%,#4b4453 0 3%,transparent 4%),linear-gradient(100deg,#08070b 0,#4a414e 18%,#17141d 48%,#3d3543 75%,#08070b 100%);box-shadow:inset 0 -35px 45px #050407,0 24px 22px #040207,0 0 0 3px #08070c}
.cauldron:before{content:"";position:absolute;left:-5%;top:-12%;width:110%;height:28%;border-radius:50%;background:radial-gradient(ellipse,#bbff75 0 34%,#40cb35 35% 48%,#16121c 50% 60%,#050407 62%);box-shadow:0 -7px 0 #4d4550,0 0 30px #71ed46}
.cauldron:after{content:"";position:absolute;left:12%;right:12%;top:6%;height:12%;border-radius:50%;background:radial-gradient(ellipse,#d9ff9a,#62eb37 50%,transparent 70%);filter:blur(5px);animation:brew 1.25s ease-in-out infinite alternate}
@keyframes brew{to{transform:scaleX(.88);filter:blur(8px) hue-rotate(22deg)}}
.handle{position:absolute;width:93%;height:78%;left:3.5%;top:-37%;border:10px solid #17121b;border-bottom:0;border-radius:50% 50% 0 0;z-index:-1;box-shadow:inset 0 0 0 3px #514657}
.leg{position:absolute;bottom:-30%;width:16%;height:42%;background:#151219;z-index:-1}.leg.l{left:14%;rotate:14deg}.leg.r{right:14%;rotate:-14deg}
.bubble{position:absolute;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f2ffd7,#7dff48 28%,#24a528 72%);box-shadow:0 0 12px #78ff4a;pointer-events:none;animation:rise var(--d) ease-out forwards}
@keyframes rise{0%{opacity:0;transform:translateY(0) scale(.3)}20%{opacity:1}100%{opacity:0;transform:translateY(-180px) translateX(var(--x)) scale(1.2)}}
.smoke{position:absolute;left:50%;bottom:39%;translate:-50% 0;width:180px;height:230px;pointer-events:none;opacity:.52;filter:blur(14px);background:radial-gradient(circle at 40% 80%,#87ff5d 0 9%,transparent 24%),radial-gradient(circle at 67% 57%,#b16cff 0 12%,transparent 30%),radial-gradient(circle at 35% 25%,#67eea2 0 11%,transparent 31%);animation:smoke 4s ease-in-out infinite alternate}
@keyframes smoke{to{transform:translateY(-20px) scale(1.15) rotate(5deg);opacity:.3}}
.ingredients{position:absolute;inset:14% 0 7%;z-index:9;pointer-events:none}
.ingredient{position:absolute;top:54%;width:clamp(58px,6vw,78px);height:clamp(76px,8.6vw,108px);border:3px solid rgba(229,206,255,.52);background:linear-gradient(105deg,rgba(255,255,255,.2),transparent 30%),radial-gradient(circle at 50% 58%,rgba(118,73,151,.82),rgba(26,12,39,.95) 74%);border-radius:15px 15px 22px 22px;box-shadow:inset 0 0 0 2px rgba(22,8,34,.45),0 10px 18px rgba(0,0,0,.5),0 0 14px rgba(169,108,255,.18);display:grid;place-items:center;cursor:grab;pointer-events:auto;touch-action:none;transition:transform .18s,opacity .3s,filter .3s}
.ingredient:hover{transform:scale(1.08);filter:brightness(1.18)}.ingredient:active{cursor:grabbing}.ingredient.used{opacity:.15;filter:grayscale(1);pointer-events:none;transform:scale(.65)}
.ingredient .icon{font-size:clamp(34px,4.4vw,54px);filter:drop-shadow(0 5px 4px #050208);transform:translateY(4px)}
.ingredient:before{content:"";position:absolute;left:18%;right:18%;top:-18px;height:17px;border:3px solid rgba(229,206,255,.48);border-bottom:0;border-radius:5px 5px 0 0;background:linear-gradient(90deg,#3b203f,#7a496f,#321a38);box-shadow:0 -5px 0 #251328}
.ingredient:after{content:"";position:absolute;left:9px;top:11px;width:8px;height:50%;border-radius:999px;background:linear-gradient(rgba(255,255,255,.38),rgba(255,255,255,0))}
.i0{left:1.5%}.i1{left:7.8%}.i2{left:14.1%}.i3{left:20.4%}.i4{right:1.5%}.i5{right:7.8%}.i6{right:14.1%}.i7{right:20.4%}
.hint{position:absolute;z-index:8;left:50%;bottom:43%;translate:-50% 0;text-align:center;color:#e7d7f2;font-size:clamp(11px,1.7vw,15px);font-weight:700;letter-spacing:.04em;text-shadow:0 2px 8px #000;opacity:.88;white-space:nowrap}
.modal,.ending{position:fixed;inset:0;z-index:50;background:rgba(5,2,10,.74);display:grid;place-items:center;padding:18px;backdrop-filter:blur(9px);opacity:0;visibility:hidden;transition:.22s}
.modal.show,.ending.show{opacity:1;visibility:visible}
.card{position:relative;width:min(92vw,590px);min-height:330px;border:1px solid #a879c9;border-radius:28px;padding:34px 30px 27px;text-align:center;background:radial-gradient(circle at 50% 0,#533168 0,#251332 55%,#150b21 100%);box-shadow:0 30px 90px #000,inset 0 0 60px rgba(172,99,235,.13);transform:translateY(22px) scale(.96);transition:.25s}
.show .card{transform:none}.card:before{content:"";position:absolute;inset:10px;border:1px solid rgba(233,199,255,.16);border-radius:20px;pointer-events:none}
.big-icon{font-size:70px;filter:drop-shadow(0 7px 7px #000);animation:float 2s ease-in-out infinite}@keyframes float{50%{transform:translateY(-8px) rotate(3deg)}}
.challenge-label{font-family:Cinzel,serif;color:#c996ff;text-transform:uppercase;letter-spacing:.18em;font-size:12px;margin:8px 0 16px}
.question{font-family:Cinzel,serif;font-size:clamp(20px,4vw,31px);line-height:1.33;margin:0 auto 28px;max-width:500px;text-wrap:balance}
.scene-image{display:none;width:100%;max-height:270px;object-fit:cover;border-radius:17px;margin:4px auto 18px;border:2px solid rgba(205,157,255,.48);box-shadow:0 12px 28px rgba(0,0,0,.45),0 0 24px rgba(126,255,80,.12)}
.scene-image.show{display:block}.card.has-image{width:min(94vw,720px);padding-top:24px}.card.has-image .big-icon{display:none}.card.has-image .question{font-size:clamp(17px,3vw,23px);margin-bottom:18px}
.actions{display:flex;justify-content:center;gap:12px;position:relative;z-index:2}
.actions button,.play-again{border:0;border-radius:999px;padding:13px 22px;font-weight:800;cursor:pointer;transition:.15s}.cancel{background:#392244;color:#decbe9}.done,.play-again{background:linear-gradient(135deg,#7bdd40,#a7ff62);color:#11220c;box-shadow:0 0 24px rgba(127,255,74,.28)}
.actions button:active,.play-again:active{transform:scale(.96)}
.ending-card{min-height:470px;overflow:hidden}.ending-visual{height:230px;display:grid;place-items:center;position:relative}.ending-emoji{font-size:130px;filter:drop-shadow(0 15px 12px #000);animation:reveal .65s cubic-bezier(.2,1.5,.4,1)}
@keyframes reveal{from{transform:scale(.1) rotate(-25deg);opacity:0}}
.ending-title{font-family:Cinzel,serif;font-size:clamp(25px,5vw,40px);color:#baff83;margin:4px 0 12px;text-shadow:0 0 18px #5ee51d}
.ending-text{font-size:15px;line-height:1.5;color:#e8dced;margin:0 0 22px}.spark{position:absolute;font-size:28px;animation:spark 1.2s ease-out forwards}@keyframes spark{to{transform:translate(var(--sx),var(--sy)) rotate(180deg);opacity:0}}
.flash{animation:flash .6s ease}@keyframes flash{35%{filter:brightness(2.5) saturate(1.8)}}
@media(max-width:700px){
 .header{top:1.3%;align-items:flex-start}.title{font-size:17px;white-space:normal;max-width:45%;line-height:1.1}
 .window{top:13%;width:48vw;height:25vh}.shelf{display:block;top:23%;width:31%;height:43%;border-bottom-width:14px}.shelf .bottle{display:none}.progress{top:9.5%}
 .ingredients{inset:15% 0 14%}.ingredient{width:54px;height:68px;top:31%;border-width:2px}.ingredient .icon{font-size:34px}.ingredient:before{top:-13px;height:13px;border-width:2px}.ingredient:after{left:6px;top:8px;width:6px}
 .i0{left:2%}.i1{left:17%;}.i2{left:2%;top:51%}.i3{left:17%;top:51%}.i4{right:2%}.i5{right:17%}.i6{right:2%;top:51%}.i7{right:17%;top:51%}
 .cauldron-wrap{width:74vw;height:43vh;bottom:3%}.hint{bottom:40%;font-size:11px}.smoke{bottom:35%}
 .card{padding:28px 20px 23px;min-height:315px}.question{font-size:21px}.ending-card{min-height:450px}
}
@media(max-height:650px) and (orientation:landscape){.title{font-size:16px}.window{top:8%;height:27vh}.progress{top:8%}.ingredients{inset:12% 0 3%}.ingredient{width:62px}.ingredient .icon{font-size:38px}.cauldron-wrap{height:58vh;width:40vw;bottom:-5%}.hint{bottom:44%}.card{min-height:280px;padding:20px}.big-icon{font-size:55px}.question{font-size:20px;margin-bottom:18px}}
</style>
</head>
<body>
<main class="game" id="game">
  <div class="window"></div>
  <div class="shelf left"><i class="bottle b1"></i><i class="bottle b2"></i><i class="bottle b3"></i><i class="bottle b4"></i></div>
  <div class="shelf right"><i class="bottle b1"></i><i class="bottle b2"></i><i class="bottle b3"></i><i class="bottle b4"></i></div>
  <header class="header">
    <div class="title" id="title">The Witch's Potion</div>
    <div class="controls">
      <div class="lang"><button class="active" data-lang="en">EN</button><button data-lang="es">ES</button></div>
      <button class="sound" id="sound" aria-label="Sound">♪</button>
      <button class="restart" id="restart" aria-label="Restart">↻</button>
    </div>
  </header>
  <div class="progress" id="progress"><i class="gem"></i><i class="gem"></i><i class="gem"></i><i class="gem"></i><i class="gem"></i></div>
  <section class="stage">
    <div class="ingredients" id="ingredients"></div>
    <div class="hint" id="hint">Drag 5 ingredients into the cauldron</div>
    <div class="cauldron-wrap" id="dropzone">
      <div class="glow"></div><div class="smoke"></div>
      <div class="cauldron" id="cauldron"><i class="handle"></i><i class="leg l"></i><i class="leg r"></i></div>
    </div>
  </section>
</main>

  ['🦇','A cloud of bats!','Your potion exploded into a hundred tiny wings. Duck before they steal your ingredients!']
 ]},
 es:{title:'La poción de la bruja',hint:'Arrastra 5 ingredientes al caldero',challenge:'RETO MÁGICO',cancel:'Otro ingrediente',done:'¡Hecho!',again:'Preparar otra poción',endings:[
  ['👻','¡Ha aparecido un fantasma!','Tu poción abrió una puerta al mundo de los espíritus. Por suerte, este fantasma parece amistoso.'],
  ['🐈‍⬛','¡Te has convertido en gato negro!','Ahora puedes ver en la oscuridad, caminar sin hacer ruido y entender todos los susurros misteriosos.'],
  ['🧙‍♀️','¡La poción ha funcionado!','Has desbloqueado el don de hablar perfectamente. Ahora cada palabra suena a magia.'],
  ['🦇','¡Una nube de murciélagos!','Tu poción explotó y se convirtió en cien alas diminutas. ¡Agáchate antes de que roben tus ingredientes!']
 ]}
};
let lang='en',used=new Set(),pending=null,audio=null,music=true,dragging=null,ambientStarted=false,ambientTimer=null,ambientStep=0;
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
function renderIngredients(){
 const box=$('#ingredients');box.innerHTML='';ingredients.forEach((item,i)=>{
  const b=document.createElement('button');b.className=`ingredient i${i}${used.has(i)?' used':''}`;b.dataset.id=i;b.setAttribute('aria-label',`Ingredient ${i+1}`);b.innerHTML=`<span class="icon">${item.icon}</span>`;
  b.addEventListener('pointerdown',startDrag);b.addEventListener('click',()=>{if(!dragging&&!used.has(i))openChallenge(i)});box.appendChild(b)
 })
}
function startDrag(e){
 const el=e.currentTarget;if(el.classList.contains('used'))return;dragging={el,id:+el.dataset.id,x:e.clientX,y:e.clientY,moved:false};el.setPointerCapture(e.pointerId);el.style.zIndex=30;
 const move=ev=>{if(!dragging)return;const dx=ev.clientX-dragging.x,dy=ev.clientY-dragging.y;if(Math.abs(dx)+Math.abs(dy)>8)dragging.moved=true;el.style.transform=`translate(${dx}px,${dy}px) scale(1.13)`};
 const up=ev=>{el.removeEventListener('pointermove',move);el.removeEventListener('pointerup',up);const r=$('#dropzone').getBoundingClientRect(),inside=ev.clientX>r.left&&ev.clientX<r.right&&ev.clientY>r.top&&ev.clientY<r.bottom;const wasMoved=dragging.moved;el.style.transform='';el.style.zIndex='';const id=dragging.id;dragging=null;if(inside&&wasMoved)openChallenge(id)};
 el.addEventListener('pointermove',move);el.addEventListener('pointerup',up)
}
function openChallenge(id){pending=id;const item=ingredients[id],showImage=!!item.image;$('#modalIcon').textContent=item.icon;$('#question').textContent=item[lang];$('#sceneImage').classList.toggle('show',showImage);$('#modal .card').classList.toggle('has-image',showImage);$('#modal').classList.add('show')}
function closeModal(){pending=null;$('#modal').classList.remove('show')}
function addIngredient(){if(pending===null)return;const id=pending;used.add(id);$('#modal').classList.remove('show');brew(id);pending=null;renderIngredients();$$('.gem').forEach((g,i)=>g.classList.toggle('on',i<used.size));if(used.size>=5)setTimeout(showEnding,1100)}
function brew(id){
 const game=$('#game'),c=$('#cauldron');game.classList.remove('flash');void game.offsetWidth;game.classList.add('flash');
 for(let i=0;i<14;i++){const b=document.createElement('i');b.className='bubble';const s=8+Math.random()*24;b.style.cssText=`width:${s}px;height:${s}px;left:${35+Math.random()*30}%;top:${-15+Math.random()*20}%;--d:${.7+Math.random()*1.1}s;--x:${-70+Math.random()*140}px`;c.appendChild(b);setTimeout(()=>b.remove(),1900)}
 tone(150+id*24,.18,'sawtooth');setTimeout(()=>tone(320+id*33,.24,'sine'),120)
}
function showEnding(){
 const data=copy[lang].endings[Math.floor(Math.random()*copy[lang].endings.length)];$('#endingEmoji').textContent=data[0];$('#endingTitle').textContent=data[1];$('#endingText').textContent=data[2];$('#playAgain').textContent=copy[lang].again;$('#ending').classList.add('show');
 const area=$('#endingVisual');for(let i=0;i<20;i++){const s=document.createElement('i');s.className='spark';s.textContent=i%2?'✦':'✧';s.style.cssText=`left:48%;top:48%;color:${i%3?'#9dff5d':'#ce8bff'};--sx:${-180+Math.random()*360}px;--sy:${-100+Math.random()*200}px`;area.appendChild(s);setTimeout(()=>s.remove(),1400)}tone(110,.7,'sawtooth');setTimeout(()=>tone(440,.6,'sine'),200)
}
function reset(){used.clear();pending=null;$('#modal').classList.remove('show');$('#ending').classList.remove('show');$$('.gem').forEach(g=>g.classList.remove('on'));renderIngredients()}
function setLang(next){lang=next;document.documentElement.lang=next;$$('.lang button').forEach(b=>b.classList.toggle('active',b.dataset.lang===next));$('#title').textContent=copy[next].title;$('#hint').textContent=copy[next].hint;$('#challengeLabel').textContent=copy[next].challenge;$('#cancel').textContent=copy[next].cancel;$('#done').textContent=copy[next].done;$('#playAgain').textContent=copy[next].again;if(pending!==null)$('#question').textContent=ingredients[pending][next]}
function initAudio(){if(audio)return;audio=new (window.AudioContext||window.webkitAudioContext)()}
function tone(freq,dur,type='sine'){if(!music)return;initAudio();const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.0001,audio.currentTime);g.gain.exponentialRampToValueAtTime(.035,audio.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+dur);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+dur+.04)}
function ambientBar(){
 if(!music||!audio||audio.state==='suspended')return;
 const roots=[110,98,130.81,87.31],root=roots[ambientStep++%roots.length],now=audio.currentTime;
 [1,1.5,2].forEach((ratio,i)=>{const o=audio.createOscillator(),g=audio.createGain(),f=audio.createBiquadFilter();o.type=i?'sine':'triangle';o.frequency.setValueAtTime(root*ratio,now);f.type='lowpass';f.frequency.value=520;g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(i?0.006:0.011,now+.8);g.gain.exponentialRampToValueAtTime(.0001,now+5.1);o.connect(f).connect(g).connect(audio.destination);o.start(now);o.stop(now+5.2)});
 if(ambientStep%2===0)setTimeout(()=>tone(root*4,.8,'sine'),900)
}
function startAmbient(){
 if(!music)return;initAudio();audio.resume();$('#sound').textContent='♫';
 if(!ambientStarted){ambientStarted=true;ambientBar();ambientTimer=setInterval(ambientBar,4800)}
}
$$('.lang button').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));$('#cancel').onclick=closeModal;$('#done').onclick=addIngredient;$('#restart').onclick=reset;$('#playAgain').onclick=reset;$('#sound').textContent='♫';$('#sound').onclick=()=>{music=!music;if(music){startAmbient();audio?.resume();$('#sound').textContent='♫'}else{audio?.suspend();$('#sound').textContent='♪'}};
document.addEventListener('pointerdown',()=>startAmbient(),{once:true});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});renderIngredients();setLang('en');
</script>
</body>
